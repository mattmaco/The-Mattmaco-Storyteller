[project]
name = "storyteller"
version = "0.1.0"
description = "Local offline PDF read-along study reader"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "platformdirs",
    "numpy",
    "soundfile",
]

[project.optional-dependencies]
voice = ["kokoro>=0.9.4", "torch"]
dev = ["pytest", "playwright", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storyteller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
