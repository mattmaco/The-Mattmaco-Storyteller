[patterns]   # regex → template; applied to the whole word
'^dN/dS$' = "d N over d S"
'^f\[([A-Za-z]\d?)\]$' = "frequency of {1}"
'^([A-Z])(\d)([A-Z])(\d)$' = "{1} {2} {3} {4}"          # A1A2 → A 1 A 2
[chars]
"²" = " squared"
"³" = " cubed"
"′" = " prime"
"̄" = " bar"
"ω" = "omega"
"Δ" = "delta "
"Σ" = "sum of "
"√" = "square root of "
"½" = "one half"
"¼" = "one quarter"
"×" = " times "
"÷" = " divided by "
"−" = " minus "
"≈" = " approximately "
"≠" = " is not equal to "
"µ" = "mu"
"α" = "alpha"
"★" = ""
"…" = "..."
"–" = " to "          # en dash between numbers (2–7); see test
"’" = "'"
"“" = ""
"”" = ""
"+" = " plus "
"=" = " equals "
